name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 20:00 UTC is 04:00 Asia/Shanghai;
    # this intentionally runs early to offset the observed schedule delay.
    - cron: '0 23 * * *'    # 07:00 Beijing — main run
    - cron: '30 0 * * *'    # 08:30 Beijing — watchdog (skips if today's digest exists)
    - cron: '30 2 * * *'    # 10:30 Beijing — watchdog (skips if today's digest exists)
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Check whether today's digest already exists
        id: gate
        run: |
          DATE=$(TZ=Asia/Shanghai date +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ -f "data/summaries/horizon-$DATE-zh.md" ] && [ -f "docs/_posts/$DATE-summary-zh.md" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Today's digest ($DATE) already exists — skipping this run."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Horizon
        if: steps.gate.outputs.exists == 'false'
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HORIZON_DEBUG_SCORES: "1"
        run: uv run horizon --hours 96

      - name: Publish new psychology item
        if: steps.gate.outputs.exists == 'false'
        run: uv run python scripts/psychological_batch.py select --limit 3

      - name: Write Chinese digest with summaries
        if: steps.gate.outputs.exists == 'false'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cp data/config.github.json data/config.json
          uv run python scripts/psych_digest.py

      - name: Archive finished day
        if: steps.gate.outputs.exists == 'false'
        run: uv run python scripts/psychological_batch.py finish

      - name: Set current date as environment variable
        run: echo "DATE=${{ steps.gate.outputs.date }}" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.exists == 'false'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Summary batch: ${{ env.DATE }} ${{ github.run_number }}"
          publish_branch: gh-pages
          enable_jekyll: true
